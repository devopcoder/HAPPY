<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Happy Birthday, Jaja ❤️</title>

<style>
:root{
  --color-bg:#050505;
  --color-fg:#ffffff;
  --color-accent:#ff4d6d;
  --color-accent-soft:#ff8fb1;
  --color-matrix:#00ff88;
  --color-glass:rgba(255,255,255,.08);
  --color-glass-border:rgba(255,255,255,.16);

  --font-base:"Segoe UI",system-ui,-apple-system,sans-serif;

  --transition-scene:900ms cubic-bezier(.22,.61,.36,1);
  --transition-fast:250ms ease;

  --z-bg-fx:1;
  --z-hearts:2;
  --z-matrix:3;
  --z-vignette:4;
  --z-scene:10;
  --z-ui:100;
}

*,
*::before,
*::after{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  min-height:100dvh;
  overflow-x:hidden;
}

body{
  font-family:var(--font-base);
  background:var(--color-bg);
  color:var(--color-fg);
  text-align:center;
  -webkit-font-smoothing:antialiased;

  padding:
    env(safe-area-inset-top)
    env(safe-area-inset-right)
    env(safe-area-inset-bottom)
    env(safe-area-inset-left);
}

button{
  font:inherit;
  border:none;
  background:none;
  cursor:pointer;
}

img{
  max-width:100%;
  display:block;
}

/* Background Layers */

.film-grain{
  position:fixed;
  inset:0;
  background:url("https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif") center/cover;
  opacity:.05;
  z-index:var(--z-bg-fx);
  pointer-events:none;
}

.vignette{
  position:fixed;
  inset:0;
  background:radial-gradient(circle,transparent 30%,rgba(0,0,0,.85) 100%);
  z-index:var(--z-vignette);
  pointer-events:none;
}

.matrix-canvas{
  position:fixed;
  inset:0;
  z-index:var(--z-matrix);
  pointer-events:none;
}

/* Phone Frame */

.app-shell{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  z-index:var(--z-scene);
}

.app-container{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
}

/* Laptop view = phone style */

@media (min-width:1024px){
  .app-container{
    width:430px;
    height:90dvh;
    border-radius:32px;
    border:1px solid rgba(255,255,255,.12);
    box-shadow:
      0 0 0 8px rgba(255,255,255,.03),
      0 20px 60px rgba(0,0,0,.7);
    overflow:hidden;
  }
}

/* Scenes */

.scene{
  position:absolute;
  inset:0;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:1.5rem;

  padding:2rem;

  opacity:0;
  transform:scale(1.15);
  filter:blur(12px);

  transition:
    opacity var(--transition-scene),
    transform var(--transition-scene),
    filter var(--transition-scene);

  pointer-events:none;
  overflow-y:auto;
}

.scene.is-active{
  opacity:1;
  transform:scale(1);
  filter:blur(0);
  pointer-events:auto;
}

/* Countdown */

.countdown{
  font-size:clamp(64px,18vw,140px);
  font-weight:800;
  line-height:1;
  text-shadow:0 0 30px var(--color-accent);
}

.countdown.is-typing{
  font-size:clamp(28px,7vw,56px);
}

.countdown__cursor{
  display:inline-block;
  margin-left:4px;
  animation:blink .9s steps(1) infinite;
}

@keyframes blink{
  0%,49%{opacity:1}
  50%,100%{opacity:0}
}

/* Titles */

.scene-title{
  font-size:clamp(20px,5vw,32px);
  font-weight:600;
}

/* Surprise */

.surprise-frame{
  width:min(90vw,340px);
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 0 30px rgba(255,255,255,.4);
}

/* Book */

.book{
  position:relative;
  width:min(90vw,360px);
  height:min(65vh,500px);
  perspective:2000px;
}

.book__page{
  position:absolute;
  inset:0;
  transform-origin:left center;
  transform-style:preserve-3d;
  transition:transform 1s ease;
  cursor:pointer;
}

.book__page.is-flipped{
  transform:rotateY(-180deg);
}

.page-face{
  position:absolute;
  inset:0;

  border-radius:12px;
  overflow:hidden;

  backface-visibility:hidden;
  -webkit-backface-visibility:hidden;

  box-shadow:0 10px 40px rgba(0,0,0,.5);
}

.page-front{
  background:#fff;
}

.page-front img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.page-back{
  background:linear-gradient(135deg,#ff4d6d,#ff8fb1);
  color:#fff;

  display:flex;
  justify-content:center;
  align-items:center;

  font-size:2rem;
  font-weight:700;

  transform:rotateY(180deg);
}

.page-back::before{
  content:"❤️";
}

/* Note */

.note{
  width:min(92vw,500px);
  padding:32px 28px;
  background:var(--color-glass);
  border:1px solid var(--color-glass-border);
  border-radius:20px;
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}

.note__title{
  font-size:clamp(22px,5vw,30px);
  margin-bottom:16px;
}

.note__body{
  font-size:16px;
  line-height:1.7;
}

.note__body + .note__body{
  margin-top:12px;
}

/* Hearts */

.heart{
  position:fixed;
  bottom:-5vh;
  color:var(--color-accent-soft);
  font-size:18px;
  pointer-events:none;
  z-index:var(--z-hearts);
  animation:floatUp 6s linear forwards;
}

@keyframes floatUp{
  from{
    transform:translateY(0) rotate(0);
    opacity:1;
  }
  to{
    transform:translateY(-110vh) rotate(20deg);
    opacity:0;
  }
}

/* Sound Button */

.sound-toggle{
  position:fixed;
  right:max(16px, env(safe-area-inset-right));
  bottom:max(16px, env(safe-area-inset-bottom));

  z-index:var(--z-ui);

  display:flex;
  align-items:center;
  gap:8px;

  padding:12px 18px;

  border-radius:999px;

  background:var(--color-accent);
  color:#fff;

  font-size:14px;
  font-weight:600;

  box-shadow:0 0 20px rgba(255,77,109,.55);

  transition:transform var(--transition-fast);
}

.sound-toggle:active{
  transform:scale(.95);
}

/* Mobile */

@media (max-width:768px){

  .scene{
    padding:1.5rem;
    gap:1rem;
  }

  .book{
    width:88vw;
    height:60vh;
  }

  .note{
    padding:24px 20px;
  }

  .note__body{
    font-size:15px;
  }

  .sound-toggle{
    padding:10px 14px;
    font-size:13px;
  }
}

/* Landscape phones */

@media (max-height:500px){

  .scene{
    justify-content:flex-start;
    padding-top:2rem;
  }

  .book{
    height:75vh;
    width:min(50vw,300px);
  }

  .countdown{
    font-size:clamp(48px,12vw,100px);
  }
}

@media (prefers-reduced-motion:reduce){

  .scene,
  .book__page,
  .sound-toggle{
    transition-duration:1ms !important;
  }

  .heart{
    display:none;
  }
}
</style>
</head>

<body>

<audio id="bgAudio" loop preload="none">
  <source src="https://raw.githubusercontent.com/devopcoder/PFO/main/G/lv_0_20260601171132_20260601_171239.mp3" type="audio/mpeg">
</audio>

<div class="film-grain"></div>
<div class="vignette"></div>

<button class="sound-toggle" id="soundToggle">
  🔊 Play music
</button>

<div class="app-shell">
  <main class="app-container">

    <section class="scene is-active" id="scene-countdown">
      <div class="countdown" id="countdownNumber">
        <span id="countdownText">3</span>
        <span class="countdown__cursor" id="countdownCursor" hidden>|</span>
      </div>
    </section>

    <section class="scene" id="scene-loading">
      <h1 class="scene-title">Loading surprise…</h1>
      <div class="surprise-frame" id="surpriseFrame"></div>
    </section>

    <section class="scene" id="scene-book">
      <h2 class="scene-title">Tap the pages ❤️</h2>

<div class="book" id="book">

  <div class="book__page">
    <div class="page-face page-front"><img src="1.png" alt="Memory 1"></div>
    <div class="page-face page-back"></div>
  </div>

  <div class="book__page">
    <div class="page-face page-front"><img src="2.png" alt="Memory 2"></div>
    <div class="page-face page-back"></div>
  </div>

  <div class="book__page">
    <div class="page-face page-front"><img src="3.png" alt="Memory 3"></div>
    <div class="page-face page-back"></div>
  </div>

  <div class="book__page">
    <div class="page-face page-front"><img src="4.png" alt="Memory 4"></div>
    <div class="page-face page-back"></div>
  </div>

  <div class="book__page">
    <div class="page-face page-front"><img src="5.png" alt="Memory 5"></div>
    <div class="page-face page-back"></div>
  </div>

  <div class="book__page">
    <div class="page-face page-front"><img src="6.png" alt="Memory 6"></div>
    <div class="page-face page-back"></div>
  </div>

  <div class="book__page">
    <div class="page-face page-front"><img src="7.png" alt="Memory 7"></div>
    <div class="page-face page-back"></div>
  </div>

  <div class="book__page">
    <div class="page-face page-front"><img src="8.png" alt="Memory 8"></div>
    <div class="page-face page-back"></div>
  </div>

  <div class="book__page">
    <div class="page-face page-front"><img src="9.png" alt="Memory 9"></div>
    <div class="page-face page-back"></div>
  </div>

  <div class="book__page">
    <div class="page-face page-front"><img src="10.png" alt="Memory 10"></div>
    <div class="page-face page-back"></div>
  </div>

</div>

      <p class="book-hint">
        Page <span id="pageCount">0</span> / 10
      </p>
    </section>

    <section class="scene" id="scene-note">
      <div class="note">
        <h2 class="note__title">Happy Birthday, Jaja ❤️</h2>

        <p class="note__body">
          I love you, Bby Jaja ❤️
        </p>

        <p class="note__body">
          You are my favorite story, my safest place, my happiest thought.
        </p>

        <p class="note__body">
          Enjoy your birthday, my love 😘
        </p>
      </div>
    </section>

  </main>
</div>

<script>
(() => {
  const CONFIG = {
    countdownStart: 3,
    heartIntervalMs: 400,
    heartLifetimeMs: 6000,
    matrixCharacters: "HAPPYBIRTHDAYJAJA❤️".split(""),
    matrixFontSize: 18,
    surpriseGifSrc: "https://madeforanita.vercel.app/image/happy3.gif",
    surpriseDurationMs: 4000,
    typingSpeedMs: 90,
    typingWordDelayMs: 1000,
    typingWords: ["HAPPY", "BIRTHDAY", "JAJA MAKULIT"]
  };

  const dom = {
    audio: document.getElementById("bgAudio"),
    soundToggle: document.getElementById("soundToggle"),
    countdownNumber: document.getElementById("countdownNumber"),
    countdownText: document.getElementById("countdownText"),
    countdownCursor: document.getElementById("countdownCursor"),
    surpriseFrame: document.getElementById("surpriseFrame"),
    book: document.getElementById("book"),
    pageCount: document.getElementById("pageCount"),
    scenes: document.querySelectorAll(".scene")
  };

  function showScene(id){
    dom.scenes.forEach(scene => scene.classList.remove("is-active"));

    setTimeout(() => {
      document.getElementById(id)?.classList.add("is-active");
    }, 300);
  }

  dom.soundToggle.addEventListener("click", () => {
    if(dom.audio.paused){
      dom.audio.play();
      dom.soundToggle.textContent = "🔊 Pause music";
    }else{
      dom.audio.pause();
      dom.soundToggle.textContent = "🔈 Play music";
    }
  });

  function spawnHeart(){
    const heart = document.createElement("div");

    heart.className = "heart";
    heart.textContent = "❤️";
    heart.style.left = Math.random() * 100 + "vw";

    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), CONFIG.heartLifetimeMs);
  }

  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches){
    setInterval(spawnHeart, CONFIG.heartIntervalMs);
  }

  function startMatrixRain(){
    const canvas = document.createElement("canvas");
    canvas.className = "matrix-canvas";

    document.body.appendChild(canvas);

    const ctx = canvas.getContext("2d");

    function resize(){
      canvas.width = innerWidth;
      canvas.height = innerHeight;
    }

    resize();
    addEventListener("resize", resize);

    const fontSize = CONFIG.matrixFontSize;
    const columns = Math.floor(canvas.width / fontSize);
    const drops = Array(columns).fill(1);

    setInterval(() => {

      ctx.fillStyle = "rgba(0,0,0,.08)";
      ctx.fillRect(0,0,canvas.width,canvas.height);

      ctx.fillStyle = "#00ff88";
      ctx.font = `${fontSize}px monospace`;

      drops.forEach((y,i) => {

        const char = CONFIG.matrixCharacters[
          Math.floor(Math.random() * CONFIG.matrixCharacters.length)
        ];

        ctx.fillText(char, i * fontSize, y * fontSize);

        drops[i] = y * fontSize > canvas.height && Math.random() > .975
          ? 0
          : y + 1;
      });

    }, 33);
  }

  const sleep = ms => new Promise(r => setTimeout(r, ms));

  function typeText(el, text, speed){
    return new Promise(resolve => {

      let i = 0;

      function tick(){
        el.textContent += text[i];
        i++;

        if(i < text.length){
          setTimeout(tick, speed);
        }else{
          resolve();
        }
      }

      tick();
    });
  }

  async function runCountdown(){

    for(let n = CONFIG.countdownStart; n >= 1; n--){
      dom.countdownText.textContent = n;
      await sleep(1000);
    }

    dom.countdownNumber.classList.add("is-typing");

    dom.countdownText.textContent = "";
    dom.countdownCursor.hidden = false;

    for(let i = 0; i < CONFIG.typingWords.length; i++){

      if(i > 0){
        dom.countdownText.textContent += " ";
      }

      await typeText(
        dom.countdownText,
        CONFIG.typingWords[i],
        CONFIG.typingSpeedMs
      );

      await sleep(CONFIG.typingWordDelayMs);
    }

    dom.countdownCursor.hidden = true;

    startMatrixRain();

    await sleep(2000);

    showScene("scene-loading");

    setTimeout(() => {

      const img = document.createElement("img");
      img.src = CONFIG.surpriseGifSrc;

      dom.surpriseFrame.appendChild(img);

      setTimeout(() => {
        showScene("scene-book");
      }, CONFIG.surpriseDurationMs);

    }, 1000);
  }

  function initBook(){

  const pages = [...dom.book.querySelectorAll(".book__page")];
  let flipped = 0;

  pages.forEach((page, index) => {
    page.style.zIndex = pages.length - index;
  });

  dom.book.addEventListener("click", () => {

    if(flipped < pages.length){

      pages[flipped].classList.add("is-flipped");

      pages[flipped].style.zIndex = flipped;

      flipped++;
      dom.pageCount.textContent = flipped;

    }else{

      showScene("scene-note");

    }

  });

}

initBook();
runCountdown();

})();


</script>

</body>
</html>
