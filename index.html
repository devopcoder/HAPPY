<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Birthday Jaja ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
overflow:hidden;
background:black;
color:white;
text-align:center;
}

/* CINEMATIC LAYERS */
body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:radial-gradient(circle, transparent 30%, rgba(0,0,0,0.85));
z-index:5;
pointer-events:none;
}

body::after{
content:"";
position:fixed;
width:100%;
height:100%;
background:url("https://media.giphy.com/media/oEI9uBYSzLpBK/giphy.gif");
opacity:0.05;
z-index:4;
pointer-events:none;
}

/* SCENES */
.scene{
position:absolute;
width:100%;
height:100%;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
opacity:0;
transform:scale(1.3);
filter:blur(10px);
transition:all 1.5s ease;
pointer-events:none;
z-index:10;
}

.active{
opacity:1;
transform:scale(1);
filter:blur(0);
pointer-events:auto;
}

/* COUNTDOWN */
#countdown{
font-size:140px;
font-weight:bold;
text-shadow:0 0 30px #ff4d6d;
}

/* MATRIX */
canvas{
position:absolute;
top:0;
left:0;
z-index:6;
}

/* GIF */
#gifBox img{
width:320px;
border-radius:20px;
box-shadow:0 0 30px white;
}

/* BOOK */
.book{
width:320px;
height:420px;
perspective:1500px;
}

.page{
width:100%;
height:100%;
position:absolute;
background:white;
color:black;
border-radius:10px;
transform-origin:left;
transition:1s;
overflow:hidden;
}

.page img{
width:100%;
height:100%;
object-fit:cover;
}

.flipped{
transform:rotateY(-180deg);
}

/* NOTE */
.note{
max-width:85%;
padding:25px;
background:rgba(255,255,255,0.1);
border-radius:15px;
backdrop-filter:blur(10px);
}

/* HEARTS */
.heart{
position:fixed;
bottom:-20px;
color:#ff8fb1;
font-size:18px;
animation:floatUp 6s linear infinite;
z-index:2;
}

@keyframes floatUp{
0%{transform:translateY(0);}
100%{transform:translateY(-110vh);}
}

/* 🎵 SOUND BUTTON */
.sound-btn{
position:fixed;
right:20px;
bottom:20px;
z-index:9999;
background:#ff4d6d;
color:white;
padding:12px 16px;
border-radius:50px;
cursor:pointer;
font-size:14px;
box-shadow:0 0 20px rgba(255,77,109,0.6);
user-select:none;
}

.sound-btn:active{
transform:scale(0.95);
}

</style>
</head>

<body>

<!-- AUDIO -->
<audio id="audio">
<source src="https://raw.githubusercontent.com/devopcoder/PFO/main/G/bad28510eeb75f10957fd3567e042324_20260601_151435.mp3">
</audio>

<!-- SOUND BUTTON -->
<div class="sound-btn" onclick="toggleSound()">
🔊 Play Music
</div>

<!-- SCENES -->

<div class="scene active" id="scene1">
<div id="countdown">3</div>
</div>

<div class="scene" id="scene2">
<h1>Loading Surprise...</h1>
<div id="gifBox"></div>
</div>

<div class="scene" id="scene3">
<h2>Click Pages ❤️</h2>
<div class="book" id="book">
<div class="page"><img src="1.png"></div>
<div class="page"><img src="2.png"></div>
<div class="page"><img src="3.png"></div>
<div class="page"><img src="4.png"></div>
<div class="page"><img src="5.png"></div>
<div class="page"><img src="6.png"></div>
<div class="page"><img src="7.png"></div>
<div class="page"><img src="8.png"></div>
<div class="page"><img src="9.png"></div>
<div class="page"><img src="10.png"></div>
</div>
</div>

<div class="scene" id="scene4">
<div class="note">
<h2>Happy Birthday, Jaja ❤️</h2>
<p>
I Love You, Bby Jaja ❤️<br><br>
You are my favorite story, my safest place, my happiest thought.<br><br>
Enjoy your 16th birthday my love 😘
</p>
</div>
</div>

<script>

let audio=document.getElementById("audio");
let isPlaying=false;

/* 🎵 MANUAL SOUND CONTROL */
function toggleSound() {
  const audio = document.getElementById("audio");

  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

/* SCENE SWITCH */
function showScene(n){
document.querySelectorAll('.scene').forEach(s=>{
s.classList.remove('active');
});
setTimeout(()=>{
document.getElementById('scene'+n).classList.add('active');
},500);
}

/* HEARTS */
setInterval(()=>{
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
},400);

/* COUNTDOWN */
let count=3;

let timer=setInterval(()=>{

count--;

if(count>1){
document.getElementById("countdown").innerText=count;
}

else if(count===1){
document.getElementById("countdown").innerText="1";
}

else if(count===0){
document.getElementById("countdown").innerText="HAPPY BIRTHDAY JAJA";
}

else{
clearInterval(timer);

setTimeout(()=>{
showMatrix();

setTimeout(()=>{
showScene(2);

setTimeout(scene2,2000);
},2000);

},2000);
}

},1000);

/* MATRIX */
function showMatrix(){
let c=document.createElement("canvas");
document.getElementById("scene1").appendChild(c);
let x=c.getContext("2d");

c.width=innerWidth;
c.height=innerHeight;

let letters="HAPPYBIRTHDAYJAJA❤️".split("");
let font=18;
let cols=c.width/font;
let drops=Array(Math.floor(cols)).fill(1);

setInterval(()=>{
x.fillStyle="rgba(0,0,0,0.08)";
x.fillRect(0,0,c.width,c.height);

x.fillStyle="#00ff88";
x.font=font+"px monospace";

for(let i=0;i<drops.length;i++){
let t=letters[Math.floor(Math.random()*letters.length)];
x.fillText(t,i*font,drops[i]*font);

if(drops[i]*font>c.height && Math.random()>0.975){
drops[i]=0;
}
drops[i]++;
}
},33);
}

/* SCENE 2 */
function scene2(){
document.getElementById("gifBox").innerHTML=
`<img src="https://madeforanita.vercel.app/image/happy3.gif">`;

setTimeout(()=>{
showScene(3);
},4000);
}

/* BOOK */
let pages=document.querySelectorAll(".page");
let i=0;

document.getElementById("book").onclick=()=>{
if(i<pages.length){
pages[i].classList.add("flipped");
i++;
}
else{
showScene(4);
}
}

</script>

</body>
</html>
